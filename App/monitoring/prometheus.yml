# Phase 4 — collecte des métriques
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Métriques temps réel de l'API (latence, débit, codes HTTP, compteurs métier)
  - job_name: rain-api
    static_configs:
      - targets: ["api:8000"]

  # Métriques de dérive : le job Evidently est éphémère, il pousse ses résultats
  # au pushgateway qui les conserve entre deux exécutions.
  - job_name: drift
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
