name: meteo-liora

# HOST_BIND — interface d'écoute des ports publiés (API exceptée, voir API_BIND).
# Par défaut la boucle locale : les machines du LAN reçoivent aussi une IPv6 publique
# que la box ne filtre pas, donc un bind sur 0.0.0.0 (donc aussi sur ::) revient à
# publier le service sur Internet, sans TLS et sans passer par le reverse proxy.
# En production, .env.prod fixe HOST_BIND et API_BIND à l'IP LAN de la VM
# (192.168.1.36), seule adresse que nginx a besoin de joindre.
services:
  # --- Tracking + Model Registry (backend SQLite, artefacts servis par le serveur) ---
  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    ports:
      # MLflow n'a aucune authentification native : jamais sur une interface publique
      - "${HOST_BIND:-127.0.0.1}:5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [mlops]

  # --- Job d'entraînement (one-shot) : `docker compose --profile train run --rm trainer` ---
  trainer:
    build:
      context: .
      dockerfile: docker/Dockerfile.trainer
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATA_PATH: /data/weatherAUS.csv
    volumes:
      - ../Data:/data:ro
    depends_on:
      mlflow:
        condition: service_healthy
    profiles: ["train"]
    networks: [mlops]

  # --- API d'inférence ---
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_URI: models:/rain-australia@champion
      DECISION_THRESHOLD: "${DECISION_THRESHOLD:-0.5}"
      PREDICTION_LOG_PATH: /app/logs/predictions.jsonl
    # Fichier à part : les hachages bcrypt contiennent des $ que l'interpolation
    # de compose mangerait s'ils passaient par .env.
    env_file:
      - path: .env.api
        required: false
    ports:
      # En dev on n'écoute que sur la boucle locale ; la prod passe API_BIND à l'IP LAN
      # de la VM dans .env.prod pour que le reverse proxy (autre VM) puisse joindre l'API.
      - "${API_BIND:-127.0.0.1}:8000:8000"
    volumes:
      # journal des prédictions : jeu "courant" lu par le job de détection de dérive
      - prediction-logs:/app/logs
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [mlops]

  # --- Site de display / démo ---
  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    environment:
      API_URL: http://api:8000
      API_USER: "${API_CLIENT_USER:-client}"
      API_PASSWORD: "${API_CLIENT_PASSWORD:-}"
    ports:
      - "${HOST_BIND:-127.0.0.1}:8501:8501"
    depends_on:
      - api
    networks: [mlops]

  # --- Monitoring : collecte des métriques exposées par l'API sur /metrics ---
  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "${HOST_BIND:-127.0.0.1}:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prom-data:/prometheus
    depends_on: [api]
    profiles: ["monitoring"]
    networks: [mlops]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "${HOST_BIND:-127.0.0.1}:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    profiles: ["monitoring"]
    networks: [mlops]

  # --- Relais pour les jobs batch : le job de dérive est éphémère, Prometheus
  #     ne peut pas le scraper directement, il pousse donc ici. ---
  pushgateway:
    image: prom/pushgateway:v1.9.0
    expose:
      - "9091"
    profiles: ["monitoring"]
    networks: [mlops]

  # --- Détection de dérive (job one-shot) :
  #     `docker compose --profile drift run --rm drift` ---
  drift:
    build:
      context: .
      dockerfile: docker/Dockerfile.drift
    environment:
      DATA_PATH: /data/weatherAUS.csv
      PREDICTION_LOG_PATH: /app/logs/predictions.jsonl
      PUSHGATEWAY_URL: pushgateway:9091
      DRIFT_SHARE_THRESHOLD: "${DRIFT_SHARE_THRESHOLD:-0.5}"
    volumes:
      - ../Data:/data:ro
      - prediction-logs:/app/logs:ro
      - drift-reports:/app/reports
    profiles: ["drift"]
    networks: [mlops]

  # --- Tableaux de bord (datasource et dashboards provisionnés par fichier) ---
  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "${HOST_BIND:-127.0.0.1}:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # pas d'appel sortant vers grafana.com au démarrage
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    profiles: ["monitoring"]
    networks: [mlops]

  # --- Orchestration (Airflow standalone) ---
  airflow:
    image: apache/airflow:2.10.4-python3.12
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      # Connexion HTTP vers l'API (utilisée par le DAG)
      AIRFLOW_CONN_RAIN_API: http://api:8000
      API_URL: http://api:8000
      API_ADMIN_USER: "${API_ADMIN_USER:-admin}"
      API_ADMIN_PASSWORD: "${API_ADMIN_PASSWORD:-}"
    ports:
      - "${HOST_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
      # résumés de dérive, en lecture seule : le DAG les lit, il ne les produit pas
      - drift-reports:/opt/airflow/drift-reports:ro
      # socket Docker retiré : plus de DockerOperator (entraînement déporté sur le PC de dev)
    depends_on:
      airflow-db:
        condition: service_healthy
    command: >
      bash -c "airflow db migrate &&
               airflow users create --role Admin --username admin --password ${AIRFLOW_ADMIN_PASSWORD:-admin}
                 --email admin@example.com --firstname Admin --lastname MLOps || true &&
               airflow scheduler &
               airflow webserver"
    profiles: ["orchestration"]
    networks: [mlops]

  airflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["orchestration"]
    networks: [mlops]

networks:
  mlops:
    driver: bridge

volumes:
  mlflow-data:
  airflow-logs:
  airflow-pgdata:
  prediction-logs:
  prom-data:
  grafana-data:
  alertmanager-data:
  drift-reports:

