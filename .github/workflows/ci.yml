name: CI — Tests & Lint

on:
  push:
    # les branches de travail sont nommées prenom_dev : sans ça, la CI ne tournait
    # qu'après la PR, donc trop tard pour être utile
    branches: [master, develop, "*_dev"]
  pull_request:
    branches: [master, develop]

jobs:
  test:
    name: Tests unitaires & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: App/requirements/test.txt

      - name: Install dependencies
        run: pip install -r requirements/test.txt

      - name: Lint (ruff)
        run: |
          ruff check src/ scripts/ dags/ --format=json > ruff.json || true
          python - <<'PY'
import json
try:
    with open('ruff.json', 'r', encoding='utf-8') as fh:
        r = json.load(fh)
        linter_issues = len(r) if isinstance(r, list) else 0
except Exception:
    linter_issues = 0
print(linter_issues)
with open('ruff_summary.json','w',encoding='utf-8') as fh:
    json.dump({'linter_issues': linter_issues}, fh)
PY

      - name: Tests (pytest)
        run: |
          # collect-only to get the number of collected tests, then run the tests
          collected=$(pytest src/tests/ --collect-only -q | tail -n1 | sed -E 's/.*\b([0-9]+) items?$/\1/' || true)
          if [ -z "$collected" ]; then
            # Fallback: try to parse pytest -q output
            pytest -q --tb=short | tee pytest_output.txt || true
            collected=$(grep -Eo 'collected [0-9]+' pytest_output.txt | head -n1 | grep -Eo '[0-9]+' || true)
          else
            pytest -q --tb=short || true
          fi
          echo "collected=$collected" > pytest_count.txt

      - name: Publish CI partial metrics (artifact)
        if: always()
        run: |
          python - <<'PY'
import json, os
tests = 0
try:
    if os.path.exists('pytest_count.txt'):
        with open('pytest_count.txt') as fh:
            for l in fh:
                if l.startswith('collected='):
                    tests = int(l.split('=',1)[1].strip())
except Exception:
    tests = 0
linter = 0
try:
    with open('ruff_summary.json','r',encoding='utf-8') as fh:
        linter = json.load(fh).get('linter_issues',0)
except Exception:
    linter = 0
data = {'tests': tests, 'linter_issues': linter}
with open('ci_metrics_partial.json','w',encoding='utf-8') as fh:
    json.dump(data, fh)
print('Wrote ci_metrics_partial.json')
PY

      - name: Upload CI metrics partial
        uses: actions/upload-artifact@v4
        with:
          name: ci_metrics_partial
          path: ci_metrics_partial.json

  compose:
    name: Validation des fichiers compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Valider le compose de développement
        run: docker compose -f App/docker-compose.yml
             --profile train --profile orchestration
             --profile monitoring --profile drift config --quiet

      - name: Valider la superposition de production
        # API_BIND et les mots de passe viennent de .env.prod, qui n'est pas versionné :
        # on fournit des valeurs bidon, seule la structure est vérifiée ici.
        env:
          API_BIND: 0.0.0.0
          AIRFLOW_ADMIN_PASSWORD: ci
          DECISION_THRESHOLD: "0.5"
        run: docker compose -f App/docker-compose.yml -f App/docker-compose.prod.yml
             --profile orchestration config --quiet

      - name: Vérifier qu'un seul port est publié pour l'API en production
        # Compose concatène les listes de ports entre fichiers : un doublon ferait
        # échouer le déploiement avec "port is already allocated".
        env:
          API_BIND: 0.0.0.0
          AIRFLOW_ADMIN_PASSWORD: ci
        run: |
          n=$(docker compose -f App/docker-compose.yml -f App/docker-compose.prod.yml config \
              | python3 -c "import sys,yaml; print(len(yaml.safe_load(sys.stdin)['services']['api'].get('ports',[])))")
          echo "ports publiés par le service api : $n"
          test "$n" -eq 1

      - name: Vérifier qu'aucun port n'écoute sur 0.0.0.0 par défaut
        # Les machines du LAN ont une IPv6 publique que la box ne filtre pas : un bind sur
        # 0.0.0.0 (donc aussi sur ::) publie le service sur Internet, sans TLS et sans passer
        # par le reverse proxy. C'est arrivé (cf. deployement/README.md, piège n° 6), d'où ce
        # garde-fou : sans HOST_BIND ni API_BIND, tout doit rester sur la boucle locale.
        run: |
          docker compose -f App/docker-compose.yml --profile train --profile orchestration \
              --profile monitoring --profile drift config \
            | python3 -c "import sys,yaml; s=yaml.safe_load(sys.stdin)['services']; f=[(n,p.get('published')) for n,c in s.items() for p in c.get('ports',[]) if p.get('host_ip')!='127.0.0.1']; print('ports non restreints :', f or 'aucun'); sys.exit(1 if f else 0)"

  build:
    name: Build des images
    runs-on: ubuntu-latest
    needs: test

    strategy:
      matrix:
        service: [api, trainer, streamlit, mlflow, drift]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.service }}
        run: docker compose -f App/docker-compose.yml build ${{ matrix.service }}

  publish-metrics:
    name: Publish CI metrics
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download partial metrics
        uses: actions/download-artifact@v4
        with:
          name: ci_metrics_partial
          path: .

      - name: Aggregate and write App/ci_metrics.json
        run: |
          python - <<'PY'
import json, os
partial = {}
if os.path.exists('ci_metrics_partial.json'):
    partial = json.load(open('ci_metrics_partial.json','r',encoding='utf-8'))
images_built = 5
data = {
  'tests': int(partial.get('tests',0)),
  'linter_issues': int(partial.get('linter_issues',0)),
  'images_built': images_built,
}
os.makedirs('App', exist_ok=True)
with open('App/ci_metrics.json','w',encoding='utf-8') as fh:
    json.dump(data, fh)
print('Wrote App/ci_metrics.json:', data)
PY

      - name: Commit ci_metrics.json back to branch (best-effort)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App/ci_metrics.json || true
          if git diff --staged --quiet; then
            echo 'No changes to commit'
          else
            git commit -m "ci: publish ci_metrics.json"
            git push
          fi
        continue-on-error: true

      - name: Upload final ci_metrics.json artifact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: ci_metrics_final
          path: App/ci_metrics.json
