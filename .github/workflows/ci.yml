name: CI — Tests & Lint

on:
  push:
    # les branches de travail sont nommées prenom_dev : sans ça, la CI ne tournait
    # qu'après la PR, donc trop tard pour être utile
    branches: [master, develop, "*_dev"]
  pull_request:
    branches: [master, develop]

jobs:
  test:
    name: Tests unitaires & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: App/requirements/test.txt

      - name: Install dependencies
        run: pip install -r requirements/test.txt

      - name: Lint (ruff)
        # Deux passes : la première produit le rapport JSON qui alimente le compteur, la
        # seconde fait échouer le job. Sans elle, le `|| true` rendrait le lint décoratif.
        # --output-format : --format a été retiré de ruff, la 0.8.6 le refuse.
        # Le heredoc doit être indenté dans le bloc, sinon le YAML est invalide.
        run: |
          ruff check src/ scripts/ dags/ --output-format=json > ruff.json || true
          python - <<'PY'
          import json
          try:
              with open('ruff.json', encoding='utf-8') as fh:
                  rapport = json.load(fh)
              nb = len(rapport) if isinstance(rapport, list) else 0
          except Exception:
              nb = 0
          print(f'remontées ruff : {nb}')
          with open('ruff_summary.json', 'w', encoding='utf-8') as fh:
              json.dump({'linter_issues': nb}, fh)
          PY
          ruff check src/ scripts/ dags/

      - name: Tests (pytest)
        # --collect-only affiche « N tests collected in X.XXs » : on extrait le nombre
        # seul, sinon la durée part avec et le compteur devient inexploitable.
        run: |
          pytest src/tests/ --collect-only -q \
            | grep -oE '^[0-9]+ tests? collected' \
            | grep -oE '^[0-9]+' > pytest_count.txt || echo 0 > pytest_count.txt
          echo "tests collectés : $(cat pytest_count.txt)"
          pytest src/tests/ -q --tb=short

      - name: Agréger les métriques du job
        if: always()
        run: |
          python - <<'PY'
          import json
          import pathlib

          def lire_entier(chemin, defaut=0):
              try:
                  return int(pathlib.Path(chemin).read_text().strip())
              except Exception:
                  return defaut

          def lire_json(chemin, cle, defaut=0):
              try:
                  return int(json.loads(pathlib.Path(chemin).read_text()).get(cle, defaut))
              except Exception:
                  return defaut

          donnees = {
              'tests': lire_entier('pytest_count.txt'),
              'linter_issues': lire_json('ruff_summary.json', 'linter_issues'),
          }
          pathlib.Path('ci_metrics_partial.json').write_text(json.dumps(donnees))
          print('métriques partielles :', donnees)
          PY

      - name: Publier les métriques partielles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci_metrics_partial
          # working-directory ne s'applique qu'aux étapes `run` : le chemin d'une
          # action part de la racine du dépôt, pas de App/.
          path: App/ci_metrics_partial.json

  compose:
    name: Validation des fichiers compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Valider le compose de développement
        run: docker compose -f App/docker-compose.yml
             --profile train --profile orchestration
             --profile monitoring --profile drift config --quiet

      - name: Valider la superposition de production
        # API_BIND et les mots de passe viennent de .env.prod, qui n'est pas versionné :
        # on fournit des valeurs bidon, seule la structure est vérifiée ici.
        env:
          API_BIND: 0.0.0.0
          AIRFLOW_ADMIN_PASSWORD: ci
          DECISION_THRESHOLD: "0.5"
        run: docker compose -f App/docker-compose.yml -f App/docker-compose.prod.yml
             --profile orchestration config --quiet

      - name: Vérifier qu'un seul port est publié pour l'API en production
        # Compose concatène les listes de ports entre fichiers : un doublon ferait
        # échouer le déploiement avec "port is already allocated".
        env:
          API_BIND: 0.0.0.0
          AIRFLOW_ADMIN_PASSWORD: ci
        run: |
          n=$(docker compose -f App/docker-compose.yml -f App/docker-compose.prod.yml config \
              | python3 -c "import sys,yaml; print(len(yaml.safe_load(sys.stdin)['services']['api'].get('ports',[])))")
          echo "ports publiés par le service api : $n"
          test "$n" -eq 1

      - name: Vérifier qu'aucun port n'écoute sur 0.0.0.0 par défaut
        # Les machines du LAN ont une IPv6 publique que la box ne filtre pas : un bind sur
        # 0.0.0.0 (donc aussi sur ::) publie le service sur Internet, sans TLS et sans passer
        # par le reverse proxy. C'est arrivé (cf. deployement/README.md, piège n° 6), d'où ce
        # garde-fou : sans HOST_BIND ni API_BIND, tout doit rester sur la boucle locale.
        run: |
          docker compose -f App/docker-compose.yml --profile train --profile orchestration \
              --profile monitoring --profile drift config \
            | python3 -c "import sys,yaml; s=yaml.safe_load(sys.stdin)['services']; f=[(n,p.get('published')) for n,c in s.items() for p in c.get('ports',[]) if p.get('host_ip')!='127.0.0.1']; print('ports non restreints :', f or 'aucun'); sys.exit(1 if f else 0)"

  build:
    name: Build des images
    runs-on: ubuntu-latest
    needs: test

    strategy:
      matrix:
        service: [api, trainer, streamlit, mlflow, drift]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.service }}
        run: docker compose -f App/docker-compose.yml build ${{ matrix.service }}

  publish-metrics:
    name: Publier les métriques CI
    runs-on: ubuntu-latest
    needs: [test, build]
    # Sur une pull request, le jeton est en lecture seule et la branche n'appartient
    # pas forcément au dépôt : on ne tente le commit que sur un push de branche.
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Récupérer les métriques partielles
        uses: actions/download-artifact@v4
        with:
          name: ci_metrics_partial
          path: .

      - name: Écrire le fichier de métriques
        run: |
          python - <<'PY'
          import json
          import pathlib

          partiel = {}
          source = pathlib.Path('ci_metrics_partial.json')
          if source.exists():
              partiel = json.loads(source.read_text())

          donnees = {
              'tests': int(partiel.get('tests', 0)),
              'linter_issues': int(partiel.get('linter_issues', 0)),
              # la matrice du job build compte cinq services
              'images_built': 5,
          }
          cible = pathlib.Path('App/src/app/ci_metrics.json')
          cible.parent.mkdir(parents=True, exist_ok=True)
          cible.write_text(json.dumps(donnees))
          print('écrit :', donnees)
          PY

      - name: Committer le fichier sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App/src/app/ci_metrics.json
          if git diff --staged --quiet; then
            echo "métriques inchangées, rien à committer"
          else
            git commit -m "ci: met à jour les métriques affichées par le Streamlit"
            git push origin HEAD:${{ github.ref_name }}
          fi
        continue-on-error: true

      - name: Publier le fichier en artefact
        uses: actions/upload-artifact@v4
        with:
          name: ci_metrics_final
          path: App/src/app/ci_metrics.json
